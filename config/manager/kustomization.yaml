apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - manager.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: mdns-operator-config
    literals:
      - MDNS_RESPONDER_DEBUG=true
      - MDNS_QM_UNICAST_FALLBACK=true

images:
  - name: ghcr.io/kylejwatson/mdns-operator
    newName: ghcr.io/kylejwatson/mdns-operator
    newTag: sha-280c48b
